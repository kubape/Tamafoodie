<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9ed52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scraps">
  <meta name="description" content="Adopt a little creature and feed it with photos of the meals you eat.">
  <title>Scraps</title>
  <link rel="manifest" href="./scraps.webmanifest">
  <link rel="apple-touch-icon" href="./assets/scraps-180.png">
  <link rel="icon" type="image/png" href="./assets/scraps-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="rail">
      <div class="identity">
        <img class="brand-icon" src="./assets/scraps-192.png" alt="" width="42" height="42">
        <span class="wordmark">scraps<span class="wordmark-dot">.</span></span>
      </div>
      <p class="rail-caption">A pet with your appetite.</p>
      <p class="local-note"><span class="local-mark" aria-hidden="true"></span> Stored on this device</p>
    </header>
    <main id="screen" class="screen" tabindex="-1" aria-busy="true">
      <p>Waking up…</p>
    </main>
    <nav class="navigation" aria-label="Main navigation" hidden>
      <a class="button primary" href="#meals"><span class="icon icon-meals" aria-hidden="true"></span><span class="navigation-label">Meals</span></a>
    </nav>
  </div>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="library" type="file" accept="image/*" hidden>
  <div id="announcement" class="sr-only" role="status"></div>
  <noscript>Scraps needs JavaScript to save your pet and meal photos.</noscript>
</body>
</html>
